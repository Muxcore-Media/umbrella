# gitleaks configuration (umbrella CI secret scan, SRS NFR-SEC-012).
[extend]
useDefault = true

[[allowlists]]
description = "Vendored third-party documentation with placeholder credentials"
paths = [
  '''^\.cursor/skills/cloudflare/references/''',
]

[[allowlists]]
description = "Placeholder enrolment secret in the integration test harness (not a credential)"
condition = "AND"
paths = [
  '''^integration/meshstack_test\.go$''',
]
regexes = [
  '''integration-enroll-secret-0123456789''',
]
