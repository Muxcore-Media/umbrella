syntax = "proto3";
package muxcore.playback.v1;
option go_package = "github.com/Muxcore-Media/playback-contract/proto/playbackv1;playbackv1";

// Normalized playback session envelope published by jellyfin/plex/emby bridges
// and ingested by playback-monitor. Mirrors monitor SessionEvent fields.
message PlaybackSessionEvent {
  string event_type = 1; // playback.started | playback.progress | playback.stopped
  string source_module = 2;
  string server_id = 3;
  string server_type = 4; // jellyfin | plex | emby | native
  string external_session_id = 5;
  string user_id = 6;
  string user_name = 7;
  string item_id = 8;
  string muxcore_id = 9;
  string title = 10;
  string media_type = 11;
  int64 position_seconds = 12;
  int64 duration_seconds = 13;
  bool is_paused = 14;
  bool is_transcode = 15;
  string platform = 16;
  string device = 17;
  string player = 18;
  string ip_address = 19;
  string media_path = 20;
  string library_name = 21;
  int64 occurred_at_unix = 22;
  string stream_resolution = 23; // SD | 480 | 720 | 1080 | QHD | 4k
  string play_method = 24; // DirectPlay | DirectStream | Transcode
}
