name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          MODULES=""
          for dir in $(echo "$CHANGED" | cut -d/ -f1 | sort -u); do
            if [ -f "$dir/go.mod" ]; then
              MODULES="$MODULES\"$dir\","
            fi
          done
          # Always include core and integration
          for m in core integration; do
            if [ -f "$m/go.mod" ] && ! echo "$MODULES" | grep -q "\"$m\""; then
              MODULES="$MODULES\"$m\","
            fi
          done
          MODULES=$(echo "$MODULES" | sed 's/,$//')
          if [ -z "$MODULES" ]; then
            MODULES='"core","integration"'
          fi
          echo "modules=[$MODULES]" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.8
      - name: Lint core
        run: cd core && golangci-lint run ./... --timeout 5m
      - name: Lint auth-local
        run: cd auth-local && golangci-lint run ./... --timeout 5m
      - name: Lint media-movies
        run: cd media-movies && golangci-lint run ./... --timeout 5m
      - name: Lint media-transcoder
        run: cd media-transcoder && golangci-lint run ./... --timeout 5m

  vet-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - core
          - auth-local
          - backup-local
          - media-movies
          - media-transcoder
          - media-transcoder-pool
          - playback-monitor
          - api-rest
          - cache-local
          - config-watcher
          - health-monitor
          - worker-pool-memory
          - distributed-lock-sqlite
          - logging-file
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go vet
        run: cd ${{ matrix.module }} && go vet ./...
      - name: go build
        run: cd ${{ matrix.module }} && go build ./...

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - core
          - auth-local
          - backup-local
          - media-movies
          - media-transcoder
          - media-transcoder-pool
          - playback-monitor
          - config-watcher
          - worker-pool-memory
          - distributed-lock-sqlite
          - logging-file
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run tests
        run: cd ${{ matrix.module }} && go test -count=1 -race -timeout 5m ./...

  integration-tests:
    runs-on: ubuntu-latest
    needs: [vet-build, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run integration tests
        run: cd integration && go test -count=1 -race -timeout 10m -tags integration ./...
