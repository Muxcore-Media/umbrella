syntax = "proto3";
package muxcore.musicbrainz.v1;
option go_package = "github.com/Muxcore-Media/metadata-musicbrainz/proto/musicbrainzv1;musicbrainzv1";

service MusicBrainzService {
  rpc SearchArtist(SearchArtistRequest) returns (SearchArtistResponse);
  rpc GetArtist(GetArtistRequest) returns (GetArtistResponse);
  rpc SearchReleaseGroup(SearchReleaseGroupRequest) returns (SearchReleaseGroupResponse);
  rpc GetReleaseGroup(GetReleaseGroupRequest) returns (GetReleaseGroupResponse);
  rpc SearchRecording(SearchRecordingRequest) returns (SearchRecordingResponse);
  rpc GetRecording(GetRecordingRequest) returns (GetRecordingResponse);
}

message ArtistSearchResult {
  string id = 1;
  string name = 2;
  string disambiguation = 3;
  string country = 4;
  string type = 5;
  int32 score = 6;
}

message SearchArtistRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchArtistResponse {
  repeated ArtistSearchResult artists = 1;
}

message ReleaseGroup {
  string id = 1;
  string title = 2;
  string primary_type = 3;
  int32 first_release_date_year = 4;
}

message GetArtistRequest {
  string musicbrainz_id = 1;
}

message GetArtistResponse {
  string id = 1;
  string name = 2;
  string disambiguation = 3;
  string country = 4;
  string type = 5;
  repeated ReleaseGroup release_groups = 6;
}

message ReleaseGroupSearchResult {
  string id = 1;
  string title = 2;
  string artist_id = 3;
  string artist_name = 4;
  string primary_type = 5;
  int32 first_release_date_year = 6;
  int32 score = 7;
}

message SearchReleaseGroupRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchReleaseGroupResponse {
  repeated ReleaseGroupSearchResult release_groups = 1;
}

message GetReleaseGroupRequest {
  string musicbrainz_id = 1;
}

message GetReleaseGroupResponse {
  string id = 1;
  string title = 2;
  string artist_id = 3;
  string artist_name = 4;
  string primary_type = 5;
  int32 first_release_date_year = 6;
}

message RecordingSearchResult {
  string id = 1;
  string title = 2;
  string artist_id = 3;
  string artist_name = 4;
  string release_group_id = 5;
  string release_group_title = 6;
  int32 score = 7;
}

message SearchRecordingRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchRecordingResponse {
  repeated RecordingSearchResult recordings = 1;
}

message GetRecordingRequest {
  string musicbrainz_id = 1;
}

message GetRecordingResponse {
  string id = 1;
  string title = 2;
  string artist_id = 3;
  string artist_name = 4;
  string release_group_id = 5;
  string release_group_title = 6;
}
