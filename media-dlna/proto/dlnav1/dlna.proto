syntax = "proto3";

package muxcore.media.dlna.v1;

option go_package = "github.com/Muxcore-Media/media-dlna/proto/dlnav1;dlnav1";

service DlnaService {
  rpc Status(StatusRequest) returns (StatusResponse);
}

message StatusRequest {}

message StatusResponse {
  bool configured = 1;
  bool running = 2;
  string friendly_name = 3;
  string browse_root = 4;
  string http_addr = 5;
  repeated string media_paths = 6;
}
