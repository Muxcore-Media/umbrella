# MuxCore household install (registry compose, ADR-0007).
# Run from repository root:
#   docker compose up -d
#
# Images come from ${MUXCORE_REGISTRY} (default LAN registry localhost:5000/muxcore,
# see _mvp/local-registry.sh; ghcr.io/muxcore-media once images are published there)
# at ${MUXCORE_IMAGE_TAG}. Step-by-step: _mvp/docs/PUBLIC-INSTALL.md.
#
# Equivalent:
#   docker compose -f _mvp/docker-compose.registry.yml up -d

# Fixed project name (same as the included file's `name:`) so volumes, the
# network and _mvp/scripts/smoke-registry.sh agree whatever the checkout
# directory is called.
name: muxcore-mvp-registry

include:
  - path: _mvp/docker-compose.registry.yml
