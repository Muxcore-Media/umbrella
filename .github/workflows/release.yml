name: Release

on:
  push:
    tags:
      - "train-*"
      - "v*"

concurrency:
  group: umbrella-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tooling
        run: |
          bash scripts/generate-changelog_test.sh
          bash scripts/prepare-release-train_test.sh

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            train-*)
              bash scripts/prepare-release-train.sh --ref "$GITHUB_SHA" \
                --tag "$RELEASE_TAG" --output release-notes.md
              ;;
            v*)
              bash scripts/generate-changelog.sh --to "$GITHUB_SHA" \
                --tag-pattern 'v*' --version "$RELEASE_TAG" --output release-notes.md
              ;;
          esac

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'train-') || contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
