# Clean-room household install + fixture smoke (roadmap T-M2-10, SM-1, ADR-0014).
# Builds every image the selected compose profiles need from the pinned submodule
# commits, pushes them to an ephemeral registry:2, installs with the root
# docker-compose.yml and runs the fixture acquisition smoke (ADR-0008: fixture
# indexer + fixture download engine only). Steps live in scripts/clean-room.sh so
# they reproduce locally (podman). Manual trigger only.
name: Clean-room install

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: Compose profiles (space-separated)
        type: string
        default: indexer-piratebay downloader-torrent
      restore_drill:
        description: Also run the compose restore drill (adds the backup-local profile)
        type: boolean
        default: false
      enforce_rss:
        description: Fail when idle RSS exceeds the NFR-PERF-003 budget (2 GiB)
        type: boolean
        default: false

concurrency:
  group: clean-room-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOPRIVATE: github.com/Muxcore-Media/*
  GONOSUMDB: github.com/Muxcore-Media/*
  GIT_TERMINAL_PROMPT: "0"

jobs:
  clean-room:
    name: Clean-room install + fixture smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKEN: ${{ secrets.MUXCORE_CI_TOKEN }}
      CLEAN_ROOM_WORKDIR: ${{ runner.temp }}/clean-room
      CLEAN_ROOM_LOG_DIR: ${{ runner.temp }}/clean-room-logs
    steps:
      - name: Require MUXCORE_CI_TOKEN (B-1)
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::MUXCORE_CI_TOKEN is not set: the module submodules and Go dependencies are private, so the clean-room job cannot build images. This is roadmap blocker B-1 (owner action: add an org CI secret). Run scripts/clean-room.sh locally until then."
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/Muxcore-Media/".insteadOf "https://github.com/Muxcore-Media/"
          git submodule update --init --jobs 8
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Clean-room install + smoke
        env:
          CONTAINER_RUNTIME: docker
          COMPOSE: docker compose
          PROFILES: ${{ inputs.profiles }}
          RESTORE_DRILL: ${{ inputs.restore_drill }}
          ENFORCE_RSS: ${{ inputs.enforce_rss }}
        run: |
          args=(--profiles "$PROFILES")
          [ "$RESTORE_DRILL" = "true" ] && args+=(--restore-drill)
          [ "$ENFORCE_RSS" = "true" ] && args+=(--enforce-rss)
          scripts/clean-room.sh "${args[@]}"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-room-logs
          path: ${{ runner.temp }}/clean-room-logs
          if-no-files-found: ignore
          retention-days: 14
